name: Rose capability map QA
on:
  push:
    paths: ['capability-map/**', 'admin-demo/rose-tools.json', '.github/workflows/capability-map-qa.yml']
  pull_request:
    paths: ['capability-map/**', 'admin-demo/rose-tools.json', '.github/workflows/capability-map-qa.yml']
permissions:
  contents: read
jobs:
  capability-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/map-qa" --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/map-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/map-qa/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Serve static map
        run: |
          python3 -m http.server 8931 --bind 127.0.0.1 > "$RUNNER_TEMP/map-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8931/capability-map/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify desktop and phone journeys
        run: node capability-map/test-map.cjs
