&lt;style&gt;
#rose-conductor-preview{color-scheme:light dark}
#rose-conductor-preview *{box-sizing:border-box}
#rose-conductor-preview [hidden]{display:none!important}
#rose-conductor-preview .rc-stage{--rose-accent:#ff5722;--rose-radius:14px;--rc-paper:light-dark(#fff,#1c1c20);--rc-ink:light-dark(#242429,#eeeef0);--rc-muted:light-dark(#85858e,#9d9da6);--rc-rule:light-dark(#e9e9ee,#34343b);--rc-soft:light-dark(#f7f7f9,#27272e);height:690px;position:relative;overflow:hidden;color:var(--rc-ink);font:400 13px/1.5 Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}
#rose-conductor-preview .rc-site{position:absolute;inset:12px;background:light-dark(#f5f5f3,#232527);border-radius:12px;padding:32px;overflow:hidden}
#rose-conductor-preview .rc-site-brand{display:flex;align-items:center;gap:10px;color:light-dark(#29404e,#b6c1c9);font-size:11px;font-weight:600;letter-spacing:.13em;opacity:.7}
#rose-conductor-preview .rc-site-brand small{display:block;font-size:7px;letter-spacing:.3em;margin-top:3px}
#rose-conductor-preview .rc-northline{display:grid;place-items:center;width:30px;height:30px;border:1px solid currentColor;font-size:17px;letter-spacing:-.18em}
#rose-conductor-preview .rc-site-copy{margin-top:145px;max-width:310px;color:light-dark(#40515b,#b6c1c9);opacity:.48}
#rose-conductor-preview .rc-site-copy small{font-size:9px;letter-spacing:.17em}
#rose-conductor-preview .rc-site-copy h2{font:400 54px/1.05 Georgia,serif;letter-spacing:-.055em;margin:18px 0 20px}
#rose-conductor-preview .rc-site-copy em{color:light-dark(#a18571,#b19b88);font-weight:400}
#rose-conductor-preview .rc-site-copy p{font-size:12px;margin:0;color:var(--rc-muted)}
#rose-conductor-preview .rc-site-bottom{position:absolute;bottom:22px;left:32px;right:32px;display:flex;justify-content:space-between;gap:15px;font-size:8px;letter-spacing:.12em;color:var(--rc-muted);opacity:.6}
#rose-conductor-preview .rc-panel{position:absolute;right:28px;bottom:29px;width:min(378px,calc(100% - 40px));height:620px;border:1px solid var(--rc-rule);border-radius:var(--rose-radius);background:var(--rc-paper);box-shadow:0 16px 48px light-dark(#16161d12,#0005),0 3px 10px light-dark(#16161d08,#0002);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
#rose-conductor-preview .rc-docked .rc-panel{top:12px;right:12px;bottom:12px;height:auto;width:min(392px,calc(100% - 24px));border-radius:var(--rose-radius) 0 0 var(--rose-radius);box-shadow:-8px 0 30px light-dark(#16161d08,#0003)}
#rose-conductor-preview .rc-panel.rc-has-glow{box-shadow:0 16px 48px light-dark(#16161d12,#0005),0 0 30px color-mix(in srgb,var(--rose-accent) 9%,transparent)}
#rose-conductor-preview .rc-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px 10px 16px;flex:none}
#rose-conductor-preview .rc-identity{display:flex;align-items:center;gap:6px;min-width:0}
#rose-conductor-preview .rc-mini-mark{width:23px;height:29px;display:grid;place-items:center;overflow:hidden;flex:none}
#rose-conductor-preview .rc-brand-logo{width:40px;height:40px;display:block;max-width:none;background-image:var(--rose-logo);background-position:center;background-size:contain;background-repeat:no-repeat}
#rose-conductor-preview .rc-wordmark{font-size:15px;letter-spacing:-.04em;font-weight:550}
#rose-conductor-preview .rc-header-actions{display:flex;align-items:center;gap:1px}
#rose-conductor-preview button{font:inherit}
#rose-conductor-preview .rc-icon{width:29px;height:29px;display:inline-grid;place-items:center;flex:none;border:0;border-radius:6px;padding:6px;background:transparent;color:var(--rc-muted)}
#rose-conductor-preview .rc-icon svg{width:15px;height:15px;stroke-width:1.5}
#rose-conductor-preview .rc-icon:hover{background:var(--rc-soft);color:var(--rc-ink)}
#rose-conductor-preview button:focus-visible,#rose-conductor-preview textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--rose-accent) 70%,transparent);outline-offset:3px}
#rose-conductor-preview .rc-content{min-height:100px;flex:1;display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin;padding:8px 20px 18px}
#rose-conductor-preview .rc-welcome{margin:auto 0;text-align:center;padding:14px 0 24px}
#rose-conductor-preview .rc-orbit{display:grid;place-items:center;position:relative;width:62px;height:62px;margin:0 auto 22px}
#rose-conductor-preview .rc-hero-logo{display:block;width:94px;height:94px;max-width:none;background-image:var(--rose-logo);background-position:center;background-size:contain;background-repeat:no-repeat}
#rose-conductor-preview .rc-welcome h3{margin:0 0 9px;font-size:18px;font-weight:500;letter-spacing:-.035em;color:var(--rc-ink)}
#rose-conductor-preview .rc-welcome p{margin:0;font-size:12px;line-height:1.7;color:var(--rc-muted)}
#rose-conductor-preview .rc-suggestions{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 17px 14px;flex:none}
#rose-conductor-preview .rc-suggestions&gt;span{font-size:10px;color:var(--rc-muted);margin-bottom:3px}
#rose-conductor-preview .rc-prompt{display:flex;align-items:center;gap:7px;max-width:100%;border:1px solid var(--rc-rule);border-radius:8px;padding:6px 9px;background:var(--rc-paper);color:var(--rc-ink);font-size:11px;text-align:left;box-shadow:0 1px 2px light-dark(#11111104,#0001)}
#rose-conductor-preview .rc-prompt svg{width:12px;height:12px;stroke-width:1.5;color:var(--rc-muted);flex:none}
#rose-conductor-preview .rc-prompt svg:last-child{display:none}
#rose-conductor-preview .rc-prompt:hover{background:var(--rc-soft);border-color:color-mix(in srgb,var(--rc-muted) 35%,var(--rc-rule))}
#rose-conductor-preview .rc-composer{margin:0 13px;flex:none;border:1px solid var(--rc-rule);border-radius:11px;padding:12px 9px 8px;background:var(--rc-paper);box-shadow:0 2px 6px light-dark(#18182004,#0001)}
#rose-conductor-preview .rc-composer:focus-within{border-color:color-mix(in srgb,var(--rose-accent) 48%,var(--rc-rule));box-shadow:0 0 0 2px color-mix(in srgb,var(--rose-accent) 4%,transparent)}
#rose-conductor-preview .rc-composer textarea{display:block;width:100%;height:47px;min-height:47px;max-height:100px;padding:0 4px;border:0;resize:none;background:transparent;color:var(--rc-ink);font:400 12px/1.65 Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}
#rose-conductor-preview .rc-composer textarea::placeholder{color:var(--rc-muted)}
#rose-conductor-preview .rc-composer textarea:focus-visible{outline:0}
#rose-conductor-preview .rc-compose-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
#rose-conductor-preview .rc-compose-left,#rose-conductor-preview .rc-compose-right{display:flex;align-items:center;gap:4px}
#rose-conductor-preview .rc-compose-hint{font-size:9px;color:var(--rc-muted);opacity:.8}
#rose-conductor-preview .rc-voice,#rose-conductor-preview .rc-send{display:grid;place-items:center;width:29px;height:29px;border:0;border-radius:7px;padding:6px;background:transparent;color:var(--rc-muted)}
#rose-conductor-preview .rc-voice svg,#rose-conductor-preview .rc-send svg{width:15px;height:15px;stroke-width:1.7}
#rose-conductor-preview .rc-voice:hover{background:var(--rc-soft)}
#rose-conductor-preview .rc-send{background:var(--rc-ink);color:var(--rc-paper)}
#rose-conductor-preview .rc-send:hover{opacity:.83}
#rose-conductor-preview .rc-footer{display:flex;align-items:center;justify-content:center;gap:4px;flex:none;height:29px;font-size:9px;color:var(--rc-muted);opacity:.66;letter-spacing:.01em}
#rose-conductor-preview .rc-footer&gt;span{opacity:.8}
#rose-conductor-preview .rc-launcher{position:absolute;right:28px;bottom:29px;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 9px;border:1px solid var(--rc-rule);border-radius:11px;background:var(--rc-paper);color:var(--rc-ink);font-size:13px;font-weight:500;box-shadow:0 3px 12px light-dark(#16161d10,#0004)}
#rose-conductor-preview .rc-launcher-mark{display:grid;place-items:center;width:25px;height:28px;overflow:hidden}
#rose-conductor-preview .rc-launcher-key{padding-left:10px;font-size:14px;color:var(--rc-muted)}
#rose-conductor-preview .rc-messages{display:flex;flex-direction:column;gap:20px}
#rose-conductor-preview .rc-msg{max-width:100%;font-size:12px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
#rose-conductor-preview .rc-msg-user{align-self:flex-end;margin-left:30px;padding:9px 12px;border-radius:11px;background:var(--rc-soft);color:var(--rc-ink)}
#rose-conductor-preview .rc-msg-bot{color:var(--rc-ink)}
#rose-conductor-preview .rc-msg-bot:before{content:&#x27;Rose&#x27;;display:block;margin-bottom:7px;font-size:10px;font-weight:500;color:var(--rc-muted)}
#rose-conductor-preview .rc-attachment{display:flex;align-items:center;gap:5px;width:fit-content;padding:3px 5px;margin-bottom:10px;background:var(--rc-soft);border:1px solid var(--rc-rule);border-radius:5px;font-size:10px;color:var(--rc-muted)}
#rose-conductor-preview .rc-attachment&gt;svg{width:11px;height:11px}
#rose-conductor-preview .rc-attachment .rc-icon{width:18px;height:18px;padding:2px}
#rose-conductor-preview .rc-attachment .rc-icon svg{width:10px;height:10px}
#rose-conductor-preview .rc-history{position:absolute;inset:58px 0 0;z-index:5;padding:26px 20px;background:var(--rc-paper);font-size:12px}
#rose-conductor-preview .rc-history&gt;span{font-weight:500}
#rose-conductor-preview .rc-history p{margin:18px 0;color:var(--rc-muted);white-space:pre-wrap}
#rose-conductor-preview .rc-text-button{padding:4px 0;border:0;background:transparent;color:var(--rc-ink);font-size:12px;text-decoration:underline;text-underline-offset:3px}
#rose-conductor-preview .rc-voice-view{position:absolute;inset:58px 0 0;z-index:6;padding:20px;background:var(--rc-paper)}
#rose-conductor-preview .rc-back{display:flex;align-items:center;gap:6px;padding:0;border:0;background:transparent;color:var(--rc-muted);font-size:11px}
#rose-conductor-preview .rc-back svg{width:13px;height:13px}
#rose-conductor-preview .rc-voice-center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100% - 32px);gap:10px;text-align:center}
#rose-conductor-preview .rc-voice-orb{display:grid;place-items:center;width:108px;height:108px;margin-bottom:18px;border-radius:50%;background:radial-gradient(circle at 32% 22%,var(--rc-paper),color-mix(in srgb,var(--rose-accent) 10%,var(--rc-paper)) 60%,color-mix(in srgb,var(--rose-accent) 22%,var(--rc-paper)));box-shadow:0 12px 32px color-mix(in srgb,var(--rose-accent) 8%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--rose-accent) 7%,transparent)}
#rose-conductor-preview .rc-voice-orb .rc-hero-logo{width:116px;height:116px}
#rose-conductor-preview .rc-voice-center h3{font-size:23px;font-weight:500;letter-spacing:-.04em;margin:0}
#rose-conductor-preview .rc-voice-center p{font-size:12px;color:var(--rc-muted);margin:0}
#rose-conductor-preview .rc-voice-center&gt;span{font-size:10px;color:var(--rc-muted);margin-bottom:14px}
#rose-conductor-preview .rc-primary{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid var(--rc-rule);border-radius:8px;background:var(--rc-paper);color:var(--rc-ink);font-size:11px}
#rose-conductor-preview .rc-primary svg{width:13px;height:13px}
@media(max-width:520px){#rose-conductor-preview .rc-stage{height:690px}#rose-conductor-preview .rc-site{inset:8px;padding:22px}#rose-conductor-preview .rc-site-copy{opacity:.15}#rose-conductor-preview .rc-panel{right:14px;bottom:24px;width:calc(100% - 28px);height:620px}#rose-conductor-preview .rc-docked .rc-panel{top:18px;right:10px;bottom:10px;width:calc(100% - 20px);border-radius:var(--rose-radius)}#rose-conductor-preview .rc-launcher{right:18px}#rose-conductor-preview .rc-site-bottom{left:20px;right:20px}}

(function(){
  var root=document.getElementById(&#x27;rose-conductor-preview&#x27;);
  if(!root)return;
  root.querySelectorAll(&#x27;[data-rose-stage]&#x27;).forEach(function(stage){
    var panel=stage.querySelector(&#x27;[data-panel]&#x27;), launcher=stage.querySelector(&#x27;[data-launcher]&#x27;), input=stage.querySelector(&#x27;[data-input]&#x27;), messages=stage.querySelector(&#x27;[data-messages]&#x27;), welcome=stage.querySelector(&#x27;[data-welcome]&#x27;), suggestions=stage.querySelector(&#x27;[data-suggestions]&#x27;), history=stage.querySelector(&#x27;[data-history]&#x27;), voice=stage.querySelector(&#x27;[data-voice]&#x27;), attachment=stage.querySelector(&#x27;[data-attachment]&#x27;);
    var conversations=[], current=[], state={accent:&#x27;#ff5722&#x27;,radius:14,glow:false};
    function render(){stage.style.setProperty(&#x27;--rose-accent&#x27;,state.accent);stage.style.setProperty(&#x27;--rose-radius&#x27;,state.radius+&#x27;px&#x27;);panel.classList.toggle(&#x27;rc-has-glow&#x27;,state.glow);}
    render();
    function toggle(open){panel.hidden=!open;launcher.hidden=open;launcher.setAttribute(&#x27;aria-expanded&#x27;,String(open));if(!open)launcher.focus();}
    function message(role,text){var item=document.createElement(&#x27;div&#x27;);item.className=&#x27;rc-msg rc-msg-&#x27;+role;item.textContent=text;messages.appendChild(item);current.push({role:role,text:text});}
    function reply(text){if(/area|albert|edmonton|where/i.test(text))return &#x27;Northline’s sample service area is Edmonton and St. Albert. For other locations, a real business would confirm coverage before arranging a visit.&#x27;;if(/service|electrical|panel|charger/i.test(text))return &#x27;Northline’s sample services cover home electrical work, panel upgrades, EV charger planning, and small commercial projects. What kind of project are you exploring?&#x27;;return &#x27;Start by telling me what you’d like to change in your space. I can help you explore the sample services and find the right section of the site. This preview doesn’t send a request or book a visit.&#x27;;}
    function send(event){if(event)event.preventDefault();var value=input.value.trim();if(!value)return;welcome.hidden=true;suggestions.hidden=true;history.hidden=true;message(&#x27;user&#x27;,value);input.value=&#x27;&#x27;;message(&#x27;bot&#x27;,reply(value));stage.querySelector(&#x27;[data-content]&#x27;).scrollTop=stage.querySelector(&#x27;[data-content]&#x27;).scrollHeight;}
    function fresh(){if(current.length)conversations.unshift(current[0].text);current=[];messages.replaceChildren();welcome.hidden=false;suggestions.hidden=false;input.value=&#x27;&#x27;;history.hidden=true;voice.hidden=true;attachment.hidden=true;stage.querySelector(&#x27;[data-action=&quot;attach&quot;]&#x27;).setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);}
    stage.querySelector(&#x27;[data-form]&#x27;).addEventListener(&#x27;submit&#x27;,send);
    input.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;&amp;&amp;!e.shiftKey){e.preventDefault();send();}});
    launcher.addEventListener(&#x27;click&#x27;,function(){toggle(true);});
    stage.querySelectorAll(&#x27;[data-prompt]&#x27;).forEach(function(button){button.addEventListener(&#x27;click&#x27;,function(){input.value=button.dataset.prompt;input.focus();});});
    stage.querySelectorAll(&#x27;[data-action]&#x27;).forEach(function(button){button.addEventListener(&#x27;click&#x27;,function(){var action=button.dataset.action;if(action===&#x27;close&#x27;)toggle(false);if(action===&#x27;new&#x27;)fresh();if(action===&#x27;history&#x27;){history.hidden=!history.hidden;button.setAttribute(&#x27;aria-expanded&#x27;,String(!history.hidden));stage.querySelector(&#x27;[data-history-text]&#x27;).textContent=conversations.length?conversations.join(&#x27;\n\n&#x27;):&#x27;No earlier conversations in this preview.&#x27;;}if(action===&#x27;history-close&#x27;){history.hidden=true;stage.querySelector(&#x27;[data-action=&quot;history&quot;]&#x27;).setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);}if(action===&#x27;attach&#x27;||action===&#x27;detach&#x27;){attachment.hidden=action===&#x27;detach&#x27;?true:!attachment.hidden;stage.querySelector(&#x27;[data-action=&quot;attach&quot;]&#x27;).setAttribute(&#x27;aria-pressed&#x27;,String(!attachment.hidden));}if(action===&#x27;voice&#x27;){voice.hidden=false;}if(action===&#x27;voice-close&#x27;){voice.hidden=true;}});});
    if(globalThis.Tweak){var tweak=new Tweak({container:panel,onChange:render});tweak.addColorPicker(state,&#x27;accent&#x27;,{label:&#x27;Rose accent&#x27;,reference:&#x27;--rose-accent&#x27;});tweak.addSlider(state,&#x27;radius&#x27;,{label:&#x27;Corner radius&#x27;,min:4,max:30,unit:&#x27;px&#x27;,reference:&#x27;--rose-radius&#x27;});tweak.addToggle(state,&#x27;glow&#x27;,{label:&#x27;Soft glow&#x27;});}
  });

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
