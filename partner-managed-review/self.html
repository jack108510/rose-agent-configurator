<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Workground · installation sample</title><style>body{font:16px/1.6 system-ui;background:#f7f3ed;color:#241e1b;max-width:800px;margin:50px auto;padding:20px}a{color:#315a65}main{background:white;border:1px solid #e6d9cc;border-radius:18px;padding:28px}textarea{width:100%;box-sizing:border-box;min-height:140px;padding:14px;background:#241e1b;color:white;border-radius:10px}button{padding:12px 20px;background:#315a65;color:white;border:0;border-radius:9px;margin-top:15px;cursor:pointer}</style><p>Review preview · example code only</p><a href="./">← Client management</a><main><h1>My Workground</h1><p>Settings → Website → Do it myself</p><h2>Your agency's own website code</h2><p>This sample demonstrates personal installation code retrieval. The actual personal Workground remains unchanged.</p><textarea id="code" readonly aria-label="Your Rose install code">&lt;script src="https://widget.example.test/rose-widget.js?client=synthetic-owner" data-website="https://agency.example.test/" async&gt;&lt;/script&gt;</textarea><button id="copy">Copy install code</button><p id="status" role="status"></p></main><script>document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('code').value);document.getElementById('status').textContent='Example code copied.'}catch{document.getElementById('status').textContent='Select the code and copy it manually.'}}</script></html>
