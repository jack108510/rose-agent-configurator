<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose · Client setup</title><style>:root{font:16px system-ui;color:#241e1b;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e8e2db;padding:18px max(20px,calc((100vw - 860px)/2))}main{max-width:860px;margin:35px auto;padding:0 20px 60px}a{color:#a33f25}h1{letter-spacing:-.04em}p{color:#655a53;line-height:1.5}.card{background:#fff;border:1px solid #e8e2db;border-radius:16px;padding:24px;margin:20px 0}label{display:block;font-weight:650;margin:15px 0 6px}input,textarea{display:block;width:100%;font:inherit;border:1px solid #d8cdc5;border-radius:9px;padding:11px}textarea{min-height:90px}button{font:inherit;border:0;border-radius:9px;background:#261f1b;color:#fff;padding:11px 16px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}.secondary{background:#eee8e1;color:#302722}.note{border-top:1px solid #eee8e2;padding:12px 0}.error{color:#a51e22}</style></head><body><script src="review-data.js?v=current-ui-2"></script><header><a href="./?view=management&tab=clients">← Agency Workground</a></header><main><h1>Client assistant setup</h1><p>Configure and publish your agency-managed clients here. Client-owned accounts require their separate editing approval.</p><p id="status" role="status">Loading…</p><section id="content" hidden><form id="setup" class="card"><h2>Assistant basics</h2><label for="businessName">Business name</label><input id="businessName" maxlength="160"><label for="website">Website</label><input id="website" type="url"><label for="assistantIntro">Assistant intro</label><textarea id="assistantIntro" maxlength="400"></textarea><label for="greetingMessage">Greeting</label><textarea id="greetingMessage" maxlength="600"></textarea><label for="brandPrimary">Accent color</label><input id="brandPrimary" type="color" value="#ff5722" style="width:75px;height:44px"><button type="submit" data-action="save">Save draft</button><button type="submit" data-action="publish" class="secondary">Save and publish</button></form><section class="card"><h2>Approved knowledge</h2><p>These notes inform Rose’s answers. Check facts with the client before adding them.</p><div id="notes"></div><form id="noteForm"><label for="noteText">Add a note</label><textarea id="noteText" maxlength="2400" required></textarea><button>Add knowledge</button></form></section></section></main><script>
const $=id=>document.getElementById(id),clientId=new URLSearchParams(location.search).get('clientId')||'';let version=0;
async function api(options={}){const response=await fetch('/api/rose-partner-client-editor'+(options.body?'':`?clientId=${encodeURIComponent(clientId)}`),{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':''}
async function load(){if(!clientId)throw new Error('Sign in to the agency Workground and choose an approved client.');const data=await api();version=data.draft.version;$('website').readOnly=data.client.management==='agency';for(const field of ['businessName','website','assistantIntro'])$(field).value=data.draft.settings[field]||'';for(const field of ['greetingMessage','brandPrimary'])$(field).value=data.draft.appearance[field]|| (field==='brandPrimary'?'#ff5722':'');$('notes').replaceChildren();for(const note of data.notes){const row=document.createElement('div');row.className='note';const text=document.createElement('p');text.textContent=note.text;row.append(text);const button=document.createElement('button');button.type='button';button.className='secondary';button.textContent='Remove note';button.onclick=async()=>{button.disabled=true;try{await api({method:'POST',body:JSON.stringify({clientId,action:'remove_note',noteId:note.id})});await load();status('Knowledge note removed')}catch(error){status(error.message,true);button.disabled=false}};row.append(button);$('notes').append(row)}$('content').hidden=false;status(data.published?'Published setup available.':'No published setup yet.')}
$('setup').onsubmit=async event=>{event.preventDefault();const action=event.submitter?.dataset.action||'save';const buttons=$('setup').querySelectorAll('button');buttons.forEach(button=>button.disabled=true);try{const body={clientId,action,version};for(const field of ['businessName','website','assistantIntro','greetingMessage','brandPrimary'])body[field]=$(field).value;const result=await api({method:'POST',body:JSON.stringify(body)});version=result.version;status(action==='publish'?'Client setup published.':'Draft saved.')}catch(error){status(error.message,true)}finally{buttons.forEach(button=>button.disabled=false)}};
$('noteForm').onsubmit=async event=>{event.preventDefault();const button=$('noteForm').querySelector('button');button.disabled=true;try{await api({method:'POST',body:JSON.stringify({clientId,action:'add_note',text:$('noteText').value})});$('noteText').value='';await load();status('Knowledge note added.')}catch(error){status(error.message,true)}finally{button.disabled=false}};load().catch(error=>status(error.message,true));
</script></body></html>
